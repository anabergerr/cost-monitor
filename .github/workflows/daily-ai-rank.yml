name: Monitor Diario de IA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Ranquear modelos
      env:
        ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python check_models.py
    - name: Publicar GitHub Pages
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- docs/index.html docs/.nojekyll
        if git diff --cached --quiet; then
          echo "Página sem mudanças"
          exit 0
        fi
        git commit -m "Atualiza ranking no GitHub Pages"
        git push
